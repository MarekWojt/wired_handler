[workspace]
members = [
    "wired_handler",
    "wired_handler_derive",
    "wired_handler_hyper",
    "wired_handler_hyper_derive",
]
resolver = "2"

[workspace.package]
version = "0.12.0"

[workspace.dependencies]
wired_handler = { path = "./wired_handler", version = "0.12.0" }
wired_handler_derive = { path = "./wired_handler_derive", version = "0.12.0" }
tokio = "1.53.1"
syn = "3.0.5"
quote = "1.0.47"
thiserror = "2.0.20"
rustc-hash = "2.1.3"
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4"] }
async_fn_traits = "0.1.1"
futures = "0.3.34"

hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
hyper-tungstenite = "0.30.0"
http-body-util = "0.1.5"
http = "1.5.0"

serde = { version = "1.0.229", features = ["derive"] }
serde_html_form = "0.4.1"
serde_json = "1.0.151"

diesel = "2.3.13"
diesel-async = { version = "0.9.2", features = [
    "postgres",
    "deadpool",
    "async-connection-wrapper",
] }
diesel_migrations = "2.3.2"
